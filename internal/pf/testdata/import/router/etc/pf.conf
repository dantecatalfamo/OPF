# $OpenBSD: pf.conf,v 1.55 2017/12/03 20:40:04 sthen Exp $
#
# My home router

ext_if = "em0"
int_if = "em1"
iot_if = "vlan20"
lan_net = "192.168.1.0/24"
tcp_services = "{ ssh, domain }"

table <martians> { 0.0.0.0/8 10.0.0.0/8 127.0.0.0/8 169.254.0.0/16 \
	172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 224.0.0.0/3 \
	198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 }
table <servers> const { 192.168.1.10 192.168.1.11 }
table <bruteforce> persist

set block-policy drop
set loginterface egress
set skip on lo
set limit states 50000

match in all scrub (no-df random-id max-mss 1440)
match out on egress inet from !(egress:network) to any nat-to (egress:0)

antispoof quick for { egress $int_if }
block in quick on egress from <martians> to any
block return out quick on egress from any to <martians>
block all	# default deny
pass out quick inet
block in quick from <bruteforce>
pass in on egress inet proto tcp from any to (egress) port 22 \
	keep state (max-src-conn 15, max-src-conn-rate 5/3, \
	overload <bruteforce> flush global)
pass in on egress inet proto tcp to (egress) port 8080 rdr-to 192.168.1.10 port 80

# Let the LAN reach everything
pass in on $int_if inet
pass in on $int_if proto tcp to $int_if port $tcp_services

# IoT devices only get out to the internet
pass in on $iot_if inet to ! $lan_net
