{{define "content"}}
{{if .}}
<table>
<thead><tr><th>Commit</th><th>Status</th><th>Files</th></tr></thead>
<tbody>
{{range .}}
<tr>
  <td><a href="/history/{{.ID}}">{{.ID}}</a></td>
  <td><span class="tag status-{{.Status}}">{{.Status}}</span></td>
  <td>{{range $i, $f := .Files}}{{if $i}}, {{end}}<code>{{$f.Path}}</code>{{end}}</td>
</tr>
{{end}}
</tbody>
</table>
{{else}}
<p>No commits yet.</p>
{{end}}
{{end}}
