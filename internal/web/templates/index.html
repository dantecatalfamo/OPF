{{define "content"}}
<table>
<thead><tr><th>File</th><th>Path</th><th>Status</th><th></th></tr></thead>
<tbody>
{{range .}}
<tr>
  <td><a href="/files/{{.File.Name}}">{{.File.Name}}</a><div class="muted">{{.File.Desc}}</div></td>
  <td><code>{{.File.Path}}</code></td>
  <td>
    {{if .Staged}}<span class="tag warn">staged</span>{{else if .Exists}}<span class="tag">live</span>{{else}}<span class="tag muted">missing</span>{{end}}
    {{if .File.Confirm}}<span class="tag" title="Changes auto-revert unless confirmed">confirm</span>{{end}}
  </td>
  <td><a href="/files/{{.File.Name}}">Edit</a></td>
</tr>
{{end}}
</tbody>
</table>
{{end}}
